name: Build PPSA99288 (Nuvio Max'd red) for ShadowMount Plus
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      PS5_PAYLOAD_SDK: /opt/ps5-payload-sdk
      BOILERPLATE_DIR: ${{ github.workspace }}/.deps/ps5-native-app-boilerplate
      MKPFS_DIR: ${{ github.workspace }}/.deps/MkPFS
      LLVM_CONFIG: llvm-config-18
      OUT_DIR: ${{ github.workspace }}/out
      USE_CCACHE: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Unzip the uploaded kit
        run: unzip -q Nuvio-Maxd-PS5-build-kit.zip

      - name: Install host packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang-18 lld-18 llvm-18 g++ zlib1g-dev python3-pip python3-venv zip unzip git curl pkg-config

      - name: PS5 payload SDK 0.44 (checksum pinned)
        run: |
          curl -fsSL https://github.com/ps5-payload-dev/sdk/releases/download/v0.44/ps5-payload-sdk.zip -o /tmp/sdk.zip
          echo "4d06eab777bb135705b5a6816688c9132efb246093fe606ac488ab6cf65ca5b0  /tmp/sdk.zip" | sha256sum -c -
          mkdir -p /tmp/sdk && unzip -q /tmp/sdk.zip -d /tmp/sdk
          root=$(dirname "$(dirname "$(find /tmp/sdk -path '*/bin/prospero-clang' | head -1)")")
          sudo mv "$root" "$PS5_PAYLOAD_SDK"
          sudo chmod -R a+rX "$PS5_PAYLOAD_SDK"
          sudo find "$PS5_PAYLOAD_SDK/bin" -type f -exec chmod a+x {} +
          ls "$PS5_PAYLOAD_SDK/bin" | head

      - name: Native app boilerplate (pinned commit)
        run: |
          mkdir -p .deps && cd .deps
          git clone https://github.com/blackbearreloaded/ps5-native-app-boilerplate
          cd ps5-native-app-boilerplate
          git checkout 2f672d1c2f508e26f82ce6e
